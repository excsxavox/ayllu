services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aylluu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aylluu
      POSTGRES_PASSWORD: aylluu
      POSTGRES_DB: aylluu
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aylluu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aylluu -d aylluu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aylluu-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aylluu_pg_data:
